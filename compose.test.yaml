name: brevly-tests

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brevly_test
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d brevly_test']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: brevly-server:local
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/brevly_test
    command: ['node', 'dist/db/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy

  server:
    image: brevly-server:local
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/brevly_test
      HOST: 0.0.0.0
      PORT: 3334
      FRONTEND_URL: http://localhost:5174
      CORS_ORIGIN: http://localhost:5174
    ports:
      - '127.0.0.1:3334:3334'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_test_data:
